name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Dummy public values: the build and e2e smoke tests never call Supabase.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The Supabase CLI is a devDependency, so CI uses the same version as
      # local development (generated types differ between CLI versions).
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (database, auth and API only)
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,supavisor,storage-api,postgres-meta
      - name: Apply migrations from scratch
        run: pnpm exec supabase db reset
      - name: RLS tests
        run: pnpm test:db
      - name: Generated types match src/types/database.ts
        run: |
          pnpm db:types
          if ! git diff --exit-code -- src/types/database.ts; then
            echo "::error file=src/types/database.ts::Out of date. Run 'pnpm db:types' after 'supabase db reset' and commit the result."
            exit 1
          fi

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # WebKit runs the image tests in Safari's engine (no WebP encoding; ADR 0002).
      - run: pnpm exec playwright install --with-deps chromium webkit
      # playwright.config.ts builds and starts the app when CI is set.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
